# Сборка «Кадра» для Windows: проверки, тест экспорта с настоящим FFmpeg, установщик и проверка запуска.
# При публикации метки вида v1.2.3 готовые файлы прикрепляются к странице релиза.
name: Сборка для Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Скачать FFmpeg
        run: node scripts/fetch-ffmpeg.mjs

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты (экспорт через настоящий FFmpeg)
        shell: pwsh
        run: |
          $env:FFMPEG = "$PWD\resources\ffmpeg\win32\ffmpeg.exe"
          npm test

      - name: Собрать установщик
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Проверить, что программа запускается
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\Kadr.exe" -ArgumentList "--smoke-test" -PassThru -Wait -RedirectStandardOutput smoke.txt
          Get-Content smoke.txt
          if ($p.ExitCode -ne 0) { throw "Программа не запустилась (код $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: Kadr-Windows
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
          if-no-files-found: error

      - name: Прикрепить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          generate_release_notes: true
