# Сборка «Хлопушки» для Windows: проверки, тест экспорта с настоящим FFmpeg, установщик и проверка запуска.
# При публикации метки вида v1.2.3 готовые файлы прикрепляются к странице релиза.
# Ручной запуск с галочкой «Выпустить релиз» сам создаёт метку v<версия из package.json> и релиз.
name: Сборка для Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить релиз с версией из package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Скачать FFmpeg
        run: node scripts/fetch-ffmpeg.mjs

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты (экспорт через настоящий FFmpeg)
        shell: pwsh
        run: |
          $env:FFMPEG = "$PWD\resources\ffmpeg\win32\ffmpeg.exe"
          npm test

      # Цифровая подпись: когда появится сертификат, добавьте в Settings → Secrets and variables → Actions
      # секреты WIN_CSC_LINK (файл .pfx в base64) и WIN_CSC_KEY_PASSWORD. Без них установщик собирается без подписи.
      - name: Собрать установщик
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SIGN_LINK: ${{ secrets.WIN_CSC_LINK }}
          SIGN_PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:SIGN_LINK) {
            $env:WIN_CSC_LINK = $env:SIGN_LINK
            $env:WIN_CSC_KEY_PASSWORD = $env:SIGN_PASS
            Write-Host 'Подписываю установщик сертификатом'
          } else {
            Write-Host 'Сертификата нет: установщик будет без цифровой подписи'
          }
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Проверить, что программа запускается
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\Hlopushka.exe" -ArgumentList "--smoke-test" -PassThru -Wait -RedirectStandardOutput smoke.txt
          Get-Content smoke.txt
          if ($p.ExitCode -ne 0) { throw "Программа не запустилась (код $($p.ExitCode))" }

      # Нейросети на компьютере по-настоящему: скачать, распознать речь, разделить голос и музыку.
      # Папка настроек с русскими буквами и пробелом — как у пользователя «C:\Users\Максим».
      - name: Проверить нейросети в собранной программе
        shell: pwsh
        run: |
          $env:KADR_SMOKE_ML = '1'
          $env:KADR_USER_DATA = Join-Path $env:RUNNER_TEMP 'Проверка Хлопушки'
          $p = Start-Process -FilePath "release\win-unpacked\Hlopushka.exe" -ArgumentList "--smoke-test" -PassThru -Wait -RedirectStandardOutput smoke-ml.txt
          Get-Content smoke-ml.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Нейросети не работают в собранной программе (код $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: Hlopushka-Windows
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
          if-no-files-found: error

      - name: Узнать версию
        id: ver
        shell: pwsh
        run: echo "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      - name: Прикрепить к релизу
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: ${{ format('Хлопушка {0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          generate_release_notes: true
